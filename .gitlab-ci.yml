stages:
  - test
  - report

variables:
  ALLURE_RESULTS_DIR: allure-results
  ALLURE_REPORT_DIR: allure-report

postman_tests:
  stage: test
  image: node:20
  script:
    - npm install -g newman newman-reporter-allure
    - newman run postman/collection.json -e postman/environment.json
        --reporters cli,junit,allure
        --reporter-junit-export results/results.xml
        --reporter-allure-export $ALLURE_RESULTS_DIR
  artifacts:
    when: always
    paths:
      - results/
      - $ALLURE_RESULTS_DIR/
    reports:
      junit: results/results.xml
    expire_in: 1 week

allure_report:
  stage: report
  image: node:20
  needs:
    - postman_tests
  script:
    - npm install -g allure-commandline
    - allure generate $ALLURE_RESULTS_DIR -o $ALLURE_REPORT_DIR --clean
  artifacts:
    paths:
      - $ALLURE_REPORT_DIR/
    expire_in: 1 week
  when: always
